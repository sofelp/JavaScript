<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabuada</title>
    <style>
        * {
            font-family: Arial, Helvetica, sans-serif;
        }
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: blue;
        }
        section {
            display: flex;
            flex-direction: column;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            width: 400px;
            height: 300px;
        }
        #tabuada {
            margin-top: 20px;
            width: 100px;
            height: 200px;
        }
    </style>
</head>
<body>
    <header>
        <h1 style="color: white;">Tabuada</h1>
    </header>
    <section>
        <div>
            Número: <input type="number" id="numero">
            <input type="button" value="Mostrar" onclick="calcular()">
        </div>
        <iframe id="tabuada" src="tabuada.html" frameborder="1"></iframe>
    </section>
    <footer>
        <p style="color: white;">&copy;felipão.com</p>
    </footer>
    <script>
        function calcular() {
            // Obter o valor do número inserido
            var numero = document.getElementById('numero').value;
            numero = parseInt(numero);

            // Validar entrada
            if (isNaN(numero) || numero === "") {
                window.alert('Por favor, digite um número válido');
                return;
            }

            // Gerar os resultados da tabuada
            let resultadoHTML = `Tabuada de ${numero}<br>`;
            for (let i = 1; i <= 10; i++) {
                resultadoHTML += `${i} x ${numero} = ${i * numero}<br>`;
            }

            // Acessar o iframe e atualizar o conteúdo
            var iframe = document.getElementById('tabuada');
            var iframeDoc = iframe.contentDocument || iframe.contentWindow.document;

            // Atualizar o conteúdo do iframe
            iframeDoc.getElementById('resultado').innerHTML = resultadoHTML;
        }
    </script>
</body>
</html>
